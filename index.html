<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGIP pfm &dash; Personal Finance Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e334d;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --blue: #60a5fa;
    --orange: #fb923c;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  /* ── Auth ─────────────────────────────────────── */
  .auth-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; }
  .auth-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:2.5rem; width:100%; max-width:420px; }
  .auth-logo { font-size:1.8rem; font-weight:800; color:var(--accent2); margin-bottom:0.25rem; letter-spacing:-0.5px; }
  .auth-sub  { color:var(--text2); font-size:.875rem; margin-bottom:2rem; }
  .auth-tabs { display:flex; gap:.5rem; margin-bottom:1.5rem; }
  .auth-tab  { flex:1; padding:.6rem; border:none; border-radius:var(--radius-sm); cursor:pointer; font-size:.875rem; font-weight:600; transition:.15s; background:var(--surface2); color:var(--text2); }
  .auth-tab.active { background:var(--accent); color:#fff; }
  label { display:block; font-size:.8rem; font-weight:600; color:var(--text2); margin-bottom:.4rem; letter-spacing:.5px; text-transform:uppercase; }
  .field { margin-bottom:1rem; }
  input[type=email],input[type=password],input[type=text],input[type=number],input[type=date],select,textarea {
    width:100%; padding:.65rem .9rem; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm);
    color:var(--text); font-size:.9rem; outline:none; transition:.15s;
  }
  input:focus,select:focus,textarea:focus { border-color:var(--accent); }
  .btn { display:inline-flex; align-items:center; gap:.4rem; padding:.65rem 1.2rem; border:none; border-radius:var(--radius-sm); cursor:pointer; font-size:.875rem; font-weight:600; transition:.15s; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { opacity:.85; }
  .btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover { border-color:var(--accent); color:var(--accent); }
  .btn-danger { background:#7f1d1d; color:#fca5a5; border:1px solid #991b1b; }
  .btn-danger:hover { background:#991b1b; }
  .btn-sm { padding:.4rem .8rem; font-size:.8rem; }
  .btn-full { width:100%; justify-content:center; }
  .auth-link { text-align:center; margin-top:1rem; font-size:.85rem; color:var(--text2); }
  .auth-link a { color:var(--accent2); cursor:pointer; text-decoration:underline; }
  .msg { padding:.65rem .9rem; border-radius:var(--radius-sm); font-size:.875rem; margin-bottom:.75rem; }
  .msg-error { background:#450a0a; border:1px solid #991b1b; color:#fca5a5; }
  .msg-success { background:#052e16; border:1px solid #166534; color:#86efac; }
  .msg-info { background:#1e1b4b; border:1px solid #3730a3; color:#a5b4fc; }

  /* ── App shell ────────────────────────────────── */
  .app { display:flex; flex-direction:column; min-height:100vh; }
  .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:.75rem 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .topbar-logo { font-size:1.1rem; font-weight:800; color:var(--accent2); }
  .topbar-nav { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .nav-btn { padding:.4rem .8rem; border:1px solid var(--border); border-radius:var(--radius-sm); background:transparent; color:var(--text2); cursor:pointer; font-size:.8rem; font-weight:600; transition:.15s; }
  .nav-btn:hover, .nav-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .nav-btn.add-btn { background:var(--accent); color:#fff; border-color:var(--accent); }
  .topbar-user { display:flex; align-items:center; gap:.5rem; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; color:#fff; }
  .main { flex:1; padding:1.5rem; max-width:1400px; margin:0 auto; width:100%; }

  /* ── Panels & cards ──────────────────────────── */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; margin-top:1rem;}
  .section-title { font-size:1.1rem; font-weight:700; margin-bottom:1rem; }
  .chart-wrap { position:relative; height:320px; }
  .chart-wrap canvas { border-radius:var(--radius-sm); }
  .empty-state { text-align:center; padding:3rem 1rem; color:var(--text2); }
  .empty-state .empty-icon { font-size:3rem; margin-bottom:1rem; }
  .empty-state h3 { font-size:1.1rem; font-weight:700; color:var(--text); margin-bottom:.5rem; }

  /* ── Modal ────────────────────────────────────── */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem; backdrop-filter:blur(2px); }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:2rem; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; }
  .modal-title { font-size:1.1rem; font-weight:700; margin-bottom:1.5rem; }
  .modal-actions { display:flex; gap:.75rem; justify-content:flex-end; margin-top:1.5rem; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }

  /* ── Table ────────────────────────────────────── */
  .table-wrap { overflow-x:auto; margin-top:1rem; }
  table { width:100%; border-collapse:collapse; font-size:.875rem; }
  th { padding:.65rem .9rem; text-align:left; font-size:.75rem; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--border); }
  td { padding:.6rem .9rem; border-bottom:1px solid var(--border); color:var(--text); }
  tr:hover td { background:var(--surface2); }
  .txn-income { color:var(--green); }
  .txn-outgoing { color:var(--red); }
  .txn-interest { color:var(--yellow); }
  .txn-transfer { color:var(--blue); }
  .txn-future { opacity:.45; font-style:italic; }
  .badge { display:inline-block; padding:.2rem .6rem; border-radius:99px; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .badge-income { background:#052e16; color:#86efac; }
  .badge-outgoing { background:#450a0a; color:#fca5a5; }
  .badge-interest { background:#451a03; color:#fed7aa; }
  .badge-transfer { background:#172554; color:#bfdbfe; }
  .running-bal { font-weight:700; }
  .running-pos { color:var(--green); }
  .running-neg { color:var(--red); }

  /* ── Date range bar ──────────────────────────── */
  .range-bar { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; }
  .range-bar input[type=date] { width:auto; padding:.4rem .75rem; }
  .range-bar label { margin:0; white-space:nowrap; }
  .txn-range-wrap { margin-top:.75rem; }
  .txn-range-meta { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; font-size:.78rem; color:var(--text2); margin-bottom:.55rem; }
  .txn-range-slider { position:relative; height:42px; user-select:none; touch-action:none; }
  .txn-range-track { position:absolute; left:0; right:0; top:50%; height:6px; transform:translateY(-50%); background:var(--surface2); border:1px solid var(--border); border-radius:999px; }
  .txn-range-selection { position:absolute; top:50%; height:10px; transform:translateY(-50%); background:rgba(108,99,255,.32); border:1px solid rgba(108,99,255,.75); border-radius:999px; cursor:grab; }
  .txn-range-selection:active { cursor:grabbing; }
  .txn-range-handle { position:absolute; top:50%; width:16px; height:16px; transform:translate(-50%,-50%); border-radius:50%; border:2px solid #dbe4ff; background:var(--accent); box-shadow:0 0 0 3px rgba(108,99,255,.18); cursor:ew-resize; padding:0; }
  .txn-range-handle:focus-visible { outline:2px solid var(--accent2); outline-offset:2px; }
  .txn-range-readout { display:flex; justify-content:space-between; gap:1rem; font-size:.8rem; color:var(--text2); margin-top:.45rem; }

  /* Inline edit row */
  .add-row td input, .add-row td select { padding:.3rem .5rem; font-size:.85rem; }
  .add-row td { vertical-align:middle; }

  /* Interest calc */
  .interest-preview { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.9rem; margin-top:.75rem; font-size:.875rem; }
  .interest-preview .big { font-size:1.3rem; font-weight:800; color:var(--green); }

  /* breadcrumb */
  .breadcrumb { display:flex; align-items:center; gap:.5rem; font-size:.8rem; color:var(--text2); margin-bottom:1rem; }
  .breadcrumb span { cursor:pointer; } .breadcrumb span:hover { color:var(--accent2); }
  .breadcrumb .sep { color:var(--text3); }

  /* scrollbar */
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  select option { background:var(--surface2); }
  .text-right { text-align:right; }
  .gap-row { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
  .spacer { flex:1; }
  .dimmed { color:var(--text3); font-style:italic; }
  .info-box { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.75rem 1rem; font-size:.85rem; color:var(--text2); margin-bottom:1rem; }

  /* ── Preferences / storage / import-export ──── */
  .pref-section { border-bottom:1px solid var(--border); padding-bottom:1.25rem; margin-bottom:1.25rem; }
  .pref-section:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .pref-section h4 { font-size:.85rem; font-weight:700; margin-bottom:.5rem; color:var(--text); }
  .pref-section .pref-desc { font-size:.8rem; color:var(--text2); margin-bottom:.75rem; line-height:1.5; }
  .storage-path { font-family:monospace; font-size:.8rem; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.5rem .75rem; color:var(--accent2); word-break:break-all; }
  .file-drop { border:2px dashed var(--border); border-radius:var(--radius-sm); padding:1.5rem; text-align:center; color:var(--text2); font-size:.85rem; cursor:pointer; transition:.15s; }
  .file-drop:hover, .file-drop.dragover { border-color:var(--accent); color:var(--accent2); }
  .icon-btn { background:transparent; border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text2); padding:.4rem .7rem; font-size:.8rem; cursor:pointer; }
  .icon-btn:hover { border-color:var(--accent); color:var(--accent2); }
  .sortable-th { cursor:pointer; user-select:none; transition:.1s; }
  .sortable-th:hover { color:var(--accent2); }
  .btn:disabled, .icon-btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn:disabled:hover, .icon-btn:disabled:hover { border-color:var(--border); color:var(--text2); }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ─────────────────────────────────────────────────────────────
//  STORAGE LAYER  (human-readable JSON; localStorage by default,
//  or a user-chosen local file via the File System Access API)
// ─────────────────────────────────────────────────────────────
const DB_KEY = 'vaultflow_db';
const DB_HANDLE_META_KEY = 'vaultflow_db_handle_meta'; // just remembers the chosen file's name for display

let dbFileHandle = null;   // FileSystemFileHandle, when user picked a custom location
let dbFileName = null;     // display name of chosen file, or null = browser storage

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { users: [], banks: [], accounts: [], transactions: [] };
}

function saveDB(db) {
  const json = JSON.stringify(db, null, 2);
  localStorage.setItem(DB_KEY, json);
  if (dbFileHandle) {
    writeToFileHandle(dbFileHandle, json).catch(err => {
      console.error('Could not write to chosen file location:', err);
    });
  }
}

async function writeToFileHandle(handle, content) {
  const writable = await handle.createWritable();
  await writable.write(content);
  await writable.close();
}

function fsAccessSupported() {
  return 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;
}

async function chooseNewDBLocation() {
  if (!fsAccessSupported()) {
    alert('Your browser does not support choosing a local file location. Chrome, Edge, or other Chromium-based browsers are required for this feature. Data will continue to be stored in browser storage.');
    return;
  }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: 'vaultflow_data.json',
      types: [{ description: 'JSON Database', accept: { 'application/json': ['.json'] } }]
    });
    dbFileHandle = handle;
    dbFileName = handle.name;
    await writeToFileHandle(handle, JSON.stringify(db, null, 2));
    state.prefMessage = `Database location set to "${handle.name}". All future changes will save here automatically (and to browser storage as a backup).`;
    renderModal();
  } catch (err) {
    if (err.name !== 'AbortError') console.error(err);
  }
}

async function openExistingDBLocation() {
  if (!fsAccessSupported()) {
    alert('Your browser does not support opening a local file location. Chrome, Edge, or other Chromium-based browsers are required for this feature.');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'JSON Database', accept: { 'application/json': ['.json'] } }]
    });
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed.users || !parsed.banks || !parsed.accounts || !parsed.transactions) {
      alert('That file does not look like a TGIP pfm database.');
      return;
    }
    dbFileHandle = handle;
    dbFileName = handle.name;
    db = parsed;
    saveDB(db);
    state.prefMessage = `Loaded database from "${handle.name}". This is now your active storage location.`;
    state.currentUser = null;
    state.screen = 'auth';
    renderModal();
    render();
  } catch (err) {
    if (err.name !== 'AbortError') console.error(err);
  }
}

function useBrowserStorageOnly() {
  dbFileHandle = null;
  dbFileName = null;
  state.prefMessage = 'Now using browser storage only.';
  renderModal();
}

let db = loadDB();
function commit() { saveDB(db); render(); }

// ─────────────────────────────────────────────────────────────
//  UTILITIES
// ─────────────────────────────────────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);
const CURRENCIES = {
  EUR: { symbol: '€', label: 'Euro (€)', locale: 'de-DE' },
  USD: { symbol: '$', label: 'US Dollar ($US)', locale: 'en-US' },
  CAD: { symbol: 'CA$', label: 'Canadian Dollar ($CA)', locale: 'en-CA' },
  NOK: { symbol: 'kr', label: 'Norwegian Krone (NOK)', locale: 'nb-NO' },
  GBP: { symbol: '£', label: 'British Pound (GBP)', locale: 'en-GB' },
};

function getUserPrefs() {
  const u = state.currentUser;
  return {
    currency: (u && u.defaultCurrency) || 'USD',
    dateFormat: (u && u.dateFormat) || 'YYYY-MM-DD',
  };
}

// fmt(amount, currencyCode?) — currencyCode defaults to the user's preference.
// Pass an account's own currency explicitly when formatting a value that
// belongs to a specific account (accounts can override the default).
const fmt = (n, currencyCode) => {
  if (n == null) return '—';
  const code = currencyCode || getUserPrefs().currency;
  const info = CURRENCIES[code] || CURRENCIES.USD;
  try {
    return new Intl.NumberFormat(info.locale, { style: 'currency', currency: code }).format(n);
  } catch (e) {
    return info.symbol + n.toFixed(2);
  }
};

// fmtDate(dateStr) — dateStr is always stored as YYYY-MM-DD; display format
// follows the user's preference but the stored value never changes.
const fmtDate = (d) => {
  if (!d) return '—';
  const fmtPref = getUserPrefs().dateFormat;
  const [y, m, day] = d.split('-');
  if (fmtPref === 'DD-MM-YYYY') return `${day}-${m}-${y}`;
  return `${y}-${m}-${day}`;
};

function addDays(dateStr, n) {
  const d = new Date(dateStr+'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function addMonths(dateStr, n) {
  const d = new Date(dateStr+'T12:00:00');
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0,10);
}

function addYears(dateStr, n) {
  const d = new Date(dateStr+'T12:00:00');
  d.setFullYear(d.getFullYear() + n);
  return d.toISOString().slice(0,10);
}

function getLast6Months() {
  const months = [];
  for (let i=5; i>=0; i--) {
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() - i);
    months.push(d.toISOString().slice(0,7));
  }
  return months;
}

function hashPass(pass) {
  // Simple hash for demo (bcrypt not available as module in browser)
  return btoa(encodeURIComponent(pass + '::vaultflow::salt'));
}
function checkPass(pass, hash) {
  return hashPass(pass) === hash;
}

// Chart color palette
const PALETTE = ['#6c63ff','#34d399','#f87171','#fbbf24','#60a5fa','#fb923c','#a78bfa','#2dd4bf','#f472b6'];

// ─────────────────────────────────────────────────────────────
//  LOGGING  (in-memory + persisted, viewable in Preferences)
// ─────────────────────────────────────────────────────────────
const LOG_KEY = 'vaultflow_logs';
const MAX_LOGS = 500;
let appLogs = [];
try { appLogs = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch(e) { appLogs = []; }

function logEvent(level, message, data) {
  const entry = {
    ts: new Date().toISOString(),
    level, // info | warn | error
    message,
    data: data !== undefined ? safeStringify(data) : undefined,
  };
  appLogs.push(entry);
  if (appLogs.length > MAX_LOGS) appLogs = appLogs.slice(-MAX_LOGS);
  try { localStorage.setItem(LOG_KEY, JSON.stringify(appLogs)); } catch(e) {}
  const tag = '[VaultFlow]';
  if (level === 'error') console.error(tag, message, data);
  else if (level === 'warn') console.warn(tag, message, data);
  else console.log(tag, message, data);
}

function safeStringify(data) {
  try {
    if (data instanceof Error) return data.message + '\n' + (data.stack||'');
    return typeof data === 'string' ? data : JSON.stringify(data);
  } catch(e) { return String(data); }
}

function clearLogs() {
  appLogs = [];
  localStorage.removeItem(LOG_KEY);
}

// Catch unhandled errors anywhere in the app
window.addEventListener('error', (e) => {
  logEvent('error', `Unhandled error: ${e.message}`, { filename: e.filename, line: e.lineno, col: e.colno });
});
window.addEventListener('unhandledrejection', (e) => {
  logEvent('error', 'Unhandled promise rejection', e.reason);
});

logEvent('info', 'App boot started');


let state = {
  screen: 'auth',      // auth | dashboard | bank | account
  authTab: 'login',
  currentUser: null,
  selectedBank: null,
  selectedAccount: null,
  authError: '',
  authSuccess: '',
  modal: null,         // null | 'addBank' | 'editBank' | 'addAccount' | 'editAccount' | 'recurringSetup' | 'termDeposit' | 'confirmDelete'
  modalData: {},
  txnRangeStart: addDays(today(), -60),
  txnRangeEnd: today(),
  txnRangeDrag: null,
  transferDestBankId: '',
  transferDestAccountId: '',
  editingTxnId: null,
  prefMessage: '',
  csvImportPreview: null,
  showLogs: false,
  txnSortCol: 'date',
  txnSortDir: 'desc',
  txnPage: 1,
  txnPageSize: 15,
};

// ─────────────────────────────────────────────────────────────
//  BUSINESS LOGIC
// ─────────────────────────────────────────────────────────────

function getUserBanks() {
  return db.banks.filter(b => b.userId === state.currentUser.id);
}

function getBankAccounts(bankId) {
  return db.accounts.filter(a => a.bankId === bankId);
}

function getAccountTxns(accountId) {
  return db.transactions.filter(t => t.accountId === accountId).sort((a,b)=>a.date.localeCompare(b.date));
}

function getRunningBalance(accountId, upToDate) {
  return db.transactions
    .filter(t => t.accountId === accountId && t.date <= upToDate)
    .reduce((sum, t) => sum + (t.signedAmount || 0), 0);
}

function getMonthEndBalance(accountId, yearMonth) {
  // last day of that month
  const [y, m] = yearMonth.split('-').map(Number);
  const lastDay = new Date(y, m, 0).toISOString().slice(0, 10);
  return getRunningBalance(accountId, lastDay);
}

function getDailyBalances(accountId, startDate, endDate) {
  const dates = [];
  let cur = startDate;
  while (cur <= endDate) { dates.push(cur); cur = addDays(cur, 1); }
  return dates.map(d => ({ date: d, balance: getRunningBalance(accountId, d) }));
}

function toDayNumber(dateStr) {
  return Math.floor(new Date(dateStr + 'T12:00:00').getTime() / 86400000);
}

function fromDayNumber(dayNum) {
  return new Date(dayNum * 86400000).toISOString().slice(0, 10);
}

function clampNumber(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function getTxnRangeBounds(accountId) {
  const txns = getAccountTxns(accountId);
  if (!txns.length) {
    const end = today();
    return { min: addDays(end, -60), max: end };
  }
  return { min: txns[0].date, max: txns[txns.length - 1].date };
}

function getBankName(bankId) {
  const bank = db.banks.find(b => b.id === bankId);
  return bank ? bank.name : 'Unknown bank';
}

function getAccountLabel(accountId) {
  const acc = db.accounts.find(a => a.id === accountId);
  if (!acc) return 'Unknown account';
  return `${getBankName(acc.bankId)} ${acc.name}`;
}

function getAccountsForBank(bankId, excludeAccountId) {
  return db.accounts.filter(a => a.bankId === bankId && a.id !== excludeAccountId);
}

function normalizeTxnRange(accountId, startDate, endDate) {
  const bounds = getTxnRangeBounds(accountId);
  const minNum = toDayNumber(bounds.min);
  const maxNum = toDayNumber(bounds.max);
  let startNum = clampNumber(toDayNumber(startDate || bounds.min), minNum, maxNum);
  let endNum = clampNumber(toDayNumber(endDate || bounds.max), minNum, maxNum);
  if (startNum > endNum) [startNum, endNum] = [endNum, startNum];
  return { start: fromDayNumber(startNum), end: fromDayNumber(endNum), bounds, minNum, maxNum, startNum, endNum };
}

function createTransaction(txn) {
  db.transactions.push({ id: uid(), ...txn });
}

function createRecurringTransactions(base, period, count) {
  for (let i = 0; i < count; i++) {
    let date = base.date;
    if (period === 'monthly') date = addMonths(base.date, i);
    else if (period === 'yearly') date = addYears(base.date, i);
    else if (period.startsWith('days:')) date = addDays(base.date, parseInt(period.slice(5)) * i);
    else if (period.startsWith('months:')) date = addMonths(base.date, parseInt(period.slice(7)) * i);
    else if (period.startsWith('years:')) date = addYears(base.date, parseInt(period.slice(6)) * i);
    else date = addDays(base.date, i);

    db.transactions.push({
      id: uid(),
      ...base,
      date,
      recurring: true,
      recurringGroup: base.recurringGroup || uid(),
      future: date > today(),
    });
  }
}

function drawScreenCharts() {
  // Charts must be created after the canvas elements exist in the DOM;
  // innerHTML-injected <script> tags never execute, so chart creation
  // is done here instead, right after each render.
  if (state.screen === 'dashboard') drawDashboardChart();
  else if (state.screen === 'bank') drawBankChart();
  else if (state.screen === 'account') drawAccountChart();
}

let _charts = [];
function destroyCharts() {
  _charts.forEach(c => { try { c.destroy(); } catch(e){} });
  _charts = [];
}
function trackChart(c) { _charts.push(c); }

// Remembers which legend entries (banks/accounts) the user has hidden,
// per chart, so toggled visibility survives the destroy/recreate cycle
// that happens on every render() call.
const _hiddenLegendKeys = { dashboard: new Set(), bank: new Set(), account: new Set() };

function makeLegendClickHandler(chartKey) {
  return function(e, legendItem, legend) {
    const chart = legend.chart;
    const label = legendItem.text;
    const hiddenSet = _hiddenLegendKeys[chartKey];
    if (hiddenSet.has(label)) hiddenSet.delete(label);
    else hiddenSet.add(label);
    const meta = chart.getDatasetMeta(legendItem.datasetIndex);
    meta.hidden = hiddenSet.has(label);
    chart.update();
  };
}

function datasetHiddenFor(chartKey, label) {
  return _hiddenLegendKeys[chartKey].has(label);
}

function renderAccountScreen() {
  const acc = db.accounts.find(a=>a.id===state.selectedAccount);
  if (!acc) return '<div class="empty-state"><h3>Account not found</h3></div>';
  const bank = db.banks.find(b=>b.id===acc.bankId);
  const normalizedRange = normalizeTxnRange(acc.id, state.txnRangeStart, state.txnRangeEnd);
  state.txnRangeStart = normalizedRange.start;
  state.txnRangeEnd = normalizedRange.end;
  const start = normalizedRange.start;
  const end = normalizedRange.end;
  const bounds = normalizedRange.bounds;
  const span = Math.max(1, normalizedRange.maxNum - normalizedRange.minNum);
  const startPct = normalizedRange.maxNum === normalizedRange.minNum ? 0 : ((normalizedRange.startNum - normalizedRange.minNum) / span) * 100;
  const endPct = normalizedRange.maxNum === normalizedRange.minNum ? 0 : ((normalizedRange.endNum - normalizedRange.minNum) / span) * 100;
  const windowPct = Math.max(0, endPct - startPct);

  // Transactions in range (date input values are 'YYYY-MM-DD' strings, comparable lexically)
  const allTxns = getAccountTxns(acc.id).filter(t => t.date >= start && t.date <= end);

  // Running balance computed in chronological order first (balance must reflect true history)
  let runBal = getRunningBalance(acc.id, addDays(start, -1));
  const chronological = allTxns.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const balanceById = {};
  chronological.forEach(t => {
    runBal += (t.signedAmount || 0);
    balanceById[t.id] = runBal;
  });
  let txnsWithBal = allTxns.map(t => ({ ...t, runningBalance: balanceById[t.id] }));

  // Sorting
  const sortCol = state.txnSortCol;
  const sortDir = state.txnSortDir;
  const sortFns = {
    date: (a,b) => a.date.localeCompare(b.date),
    type: (a,b) => a.type.localeCompare(b.type),
    description: (a,b) => (a.description||'').localeCompare(b.description||''),
    amount: (a,b) => (a.signedAmount||0) - (b.signedAmount||0),
    balance: (a,b) => (a.runningBalance||0) - (b.runningBalance||0),
  };
  txnsWithBal.sort(sortFns[sortCol] || sortFns.date);
  if (sortDir === 'desc') txnsWithBal.reverse();

  // Pagination
  const pageSize = state.txnPageSize;
  const totalRows = txnsWithBal.length;
  const totalPages = Math.max(1, Math.ceil(totalRows / pageSize));
  if (state.txnPage > totalPages) state.txnPage = totalPages;
  if (state.txnPage < 1) state.txnPage = 1;
  const pageStart = (state.txnPage - 1) * pageSize;
  const pageRows = txnsWithBal.slice(pageStart, pageStart + pageSize);

  const sortArrow = (col) => sortCol === col ? (sortDir === 'asc' ? ' ^' : ' v') : '';

  const txnRows = pageRows.map(t => {
    const isFuture = t.date > today();
    const cls = isFuture ? 'txn-future' : '';
    return `<tr class="${cls}" data-txn-id="${t.id}">
      <td>${fmtDate(t.date)}</td>
      <td><span class="badge badge-${t.type}">${t.type}</span>${t.recurring?'<span style="margin-left:.3rem;font-size:.7rem;color:var(--text3)">?</span>':''}</td>

      <td class="running-bal ${t.runningBalance>=0?'running-pos':'running-neg'} text-right">${fmt(t.runningBalance, acc.currency)}</td>

          <button class="btn btn-danger btn-sm" data-action="deleteTxn" data-id="${t.id}">Del</button>

      </td>
    </tr>`;
  }).join('');

  // New transaction row
  const allAccounts = db.accounts.filter(a=>a.id!==acc.id);
  const transferBanks = [...new Map(
    allAccounts
      .map(a => [a.bankId, db.banks.find(b => b.id === a.bankId)])
      .filter(([, b]) => b)
  ).values()];

    ? state.transferDestBankId

  const transferBankOptions = transferBanks.map(b => `<option value="${b.id}" ${b.id===defaultTransferBankId?'selected':''}>${esc(b.name)}</option>`).join('');
  const transferAccounts = defaultTransferBankId ? getAccountsForBank(defaultTransferBankId, acc.id) : [];
  const defaultTransferAccountId = state.transferDestAccountId && transferAccounts.some(a => a.id === state.transferDestAccountId)
    ? state.transferDestAccountId
    : (transferAccounts[0] ? transferAccounts[0].id : '');
  const transferAccountOptions = transferAccounts.map(a => `<option value="${a.id}" ${a.id===defaultTransferAccountId?'selected':''}>${esc(a.name)}</option>`).join('');

  const txnTypeOptions = `
    <option value="">type</option>
    <option value="income">Income</option>
    <option value="outgoing">Outgoing</option>
    <option value="transfer">Transfer</option>
    <option value="interest">Interest</option>

    <option value="recurring">Recurring</option>`;

  const paginationBar = totalRows > 0 ? `
    <div class="gap-row" style="margin-top:.75rem;justify-content:space-between">
      <div style="font-size:.8rem;color:var(--text2)">

        <select id="txn-page-size" style="width:auto;padding:.35rem .5rem;font-size:.8rem;margin-left:.5rem">
          <option value="10" ${pageSize===10?'selected':''}>10 / page</option>
          <option value="15" ${pageSize===15?'selected':''}>15 / page</option>
          <option value="30" ${pageSize===30?'selected':''}>30 / page</option>
          <option value="50" ${pageSize===50?'selected':''}>50 / page</option>
        </select>
      </div>
    </div>` : '';

  return `

  <span data-action="goDash">Dashboard</span><span class="sep">?</span>
  <span data-action="goBank" data-id="${acc.bankId}">${esc(bank?bank.name:'Bank')}</span><span class="sep">?</span>

function drawAccountChart() {
  const ctx = document.getElementById('acc-chart');
  if (!ctx) return;
  const acc = db.accounts.find(a=>a.id===state.selectedAccount);
  if (!acc) return;
  const range = normalizeTxnRange(acc.id, state.txnRangeStart, state.txnRangeEnd);
  const start = range.start;
  const end = range.end;
  const dailyData = getDailyBalances(acc.id, start, end);
  const labels = dailyData.map(d=>d.date);
  const data = dailyData.map(d=>d.balance);
  const symbol = (CURRENCIES[acc.currency || getUserPrefs().currency] || CURRENCIES.USD).symbol;
  const c = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{
      label:'Balance', data, borderColor:'#6c63ff', backgroundColor:'rgba(108,99,255,.15)',
      fill:true, tension:.3, pointRadius:0, borderWidth:2
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ grid:{color:'#2e334d'}, ticks:{color:'#94a3b8', maxTicksLimit:8} },
        y:{ grid:{color:'#2e334d'}, ticks:{color:'#94a3b8', callback:v=>symbol+v.toLocaleString()} }
      }
    }
  });
  trackChart(c);
}

function closeModal() {
  const o = document.getElementById('modal-overlay');
  if (o) o.remove();
  state.modal = null;
  state.modalData = {};
}

function calcTermDepositPreview() {
  const amt = parseFloat(document.getElementById('m-td-amt')?.value)||0;
  const rate = parseFloat(document.getElementById('m-td-rate')?.value)||0;
  const term = parseFloat(document.getElementById('m-td-term')?.value)||12;
  const parentId = document.getElementById('m-td-parent')?.value;
  const parentAcc = parentId ? db.accounts.find(a=>a.id===parentId) : null;
  const currency = parentAcc ? parentAcc.currency : undefined;
  const interest = amt * (rate/100) * (term/12);
  const total = amt + interest;
  const io = document.getElementById('td-interest-out');
  const to = document.getElementById('td-total-out');
  if (io) io.textContent = fmt(interest, currency);
  if (to) to.textContent = fmt(total, currency);
}

function updateTDEnd() {
  const term = parseInt(document.getElementById('m-td-term')?.value)||12;
  const date = state.modalData.date || today();
  const endEl = document.getElementById('m-td-end');
  if (endEl) endEl.value = addMonths(date, term);
  calcTermDepositPreview();
}

// ─────────────────────────────────────────────────────────────
//  EVENT BINDING
// ─────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function numVal(id) { return parseFloat(val(id))||0; }

let _eventsBound = false;
function bindEvents() {
  if (_eventsBound) return;
  document.body.addEventListener('click', handleClick, { capture: false });
  document.body.addEventListener('change', handleChange, { capture: false });
  document.body.addEventListener('pointerdown', handlePointerDown, { capture: false });
  window.addEventListener('pointermove', handlePointerMove, { capture: false });
  window.addEventListener('pointerup', handlePointerUp, { capture: false });
  window.addEventListener('pointercancel', handlePointerUp, { capture: false });
  _eventsBound = true;
}

function handleChange(e) {
  const id = e.target.id;
  if (id === 'range-start') { state.txnRangeStart = e.target.value; state.txnPage = 1; render(); }
  if (id === 'range-end')   { state.txnRangeEnd   = e.target.value; state.txnPage = 1; render(); }
  if (id === 'txn-page-size') { state.txnPageSize = parseInt(e.target.value)||15; state.txnPage = 1; render(); }
  if (id === 'new-txn-type') {
    if (e.target.value === 'transfer') {
      const candidateBanks = [...new Set(db.accounts.filter(a => a.id !== state.selectedAccount).map(a => a.bankId))];
      if (!state.transferDestBankId || !candidateBanks.includes(state.transferDestBankId)) {
        state.transferDestBankId = candidateBanks[0] || '';
      }
      const candidateAccounts = getAccountsForBank(state.transferDestBankId, state.selectedAccount);
      if (!state.transferDestAccountId || !candidateAccounts.some(a => a.id === state.transferDestAccountId)) {
        state.transferDestAccountId = candidateAccounts[0] ? candidateAccounts[0].id : '';
      }
      state.modal = 'transferTxn';
      state.modalData = {};
      renderModal();
      return;
    }
    if (e.target.value === 'recurring') {
      state.modal = 'recurringSetup';
      state.modalData = {};
      renderModal();
    }
    if (e.target.value === 'term_deposit') {
      state.modal = 'termDeposit';
      state.modalData = { date: val('new-txn-date'), amount: numVal('new-txn-amt') };
      renderModal();
    }
  }
  if (id === 'transfer-dest-bank') {
    state.modalData.transferAmount = document.getElementById('transfer-amount')?.value || state.modalData.transferAmount || '';
    state.transferDestBankId = e.target.value;
    const candidateAccounts = getAccountsForBank(state.transferDestBankId, state.selectedAccount);
    state.transferDestAccountId = candidateAccounts[0] ? candidateAccounts[0].id : '';
    renderModal();
    return;
  }
  if (id === 'transfer-dest-account') {
    state.modalData.transferAmount = document.getElementById('transfer-amount')?.value || state.modalData.transferAmount || '';
    state.transferDestAccountId = e.target.value;
    renderModal();
    return;
  }
  if (id === 'transfer-amount') {
    state.modalData.transferAmount = e.target.value;
    return;
  }
}

function handleClick(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  e.stopPropagation();

  // AUTH
  if (action==='authTab') { state.authError=''; state.authSuccess=''; state.authTab=btn.dataset.tab; render(); return; }
  if (action==='login') { doLogin(); return; }
  if (action==='register') { doRegister(); return; }
  if (action==='resetRequest') { doResetRequest(); return; }
  if (action==='logout') { doLogout(); return; }

  // NAV
  if (action==='goDash') { state.screen='dashboard'; state.selectedBank=null; state.selectedAccount=null; render(); return; }
  if (action==='goBank') { const id=btn.dataset.id||state.selectedBank; state.screen='bank'; state.selectedBank=id; state.selectedAccount=null; render(); return; }
  if (action==='selectBank') { state.screen='bank'; state.selectedBank=btn.dataset.id; state.selectedAccount=null; render(); return; }
  if (action==='selectAccount') { state.screen='account'; state.selectedAccount=btn.dataset.id; state.txnPage=1; state.txnRangeStart=addDays(today(), -60); state.txnRangeEnd=today(); state.transferDestBankId=''; state.transferDestAccountId=''; render(); return; }

  // MODALS
  if (action==='openModal') { state.modal=btn.dataset.modal; state.modalData=btn.dataset.id?{id:btn.dataset.id}:{}; state.prefMessage=''; renderModal(); return; }
  if (action==='closeModal') { closeModal(); return; }

  // BANKS
  if (action==='editBank') { e.stopPropagation(); state.modal='editBank'; state.modalData={id:btn.dataset.id}; renderModal(); return; }
  if (action==='deleteBank') { e.stopPropagation(); handleDeleteBank(btn.dataset.id); return; }
  if (action==='saveNewBank') { saveNewBank(); return; }
  if (action==='saveEditBank') { saveEditBank(btn.dataset.id); return; }

  // ACCOUNTS
  if (action==='editAccount') { e.stopPropagation(); state.modal='editAccount'; state.modalData={id:btn.dataset.id}; renderModal(); return; }
  if (action==='deleteAccount') { e.stopPropagation(); handleDeleteAccount(btn.dataset.id); return; }
  if (action==='saveNewAccount') { saveNewAccount(); return; }
  if (action==='saveEditAccount') { saveEditAccount(btn.dataset.id); return; }

  // TRANSACTIONS
  if (action==='addTxn') { addTransaction(); return; }
  if (action==='editTxn') { state.modal='editTxn'; state.modalData={id:btn.dataset.id}; renderModal(); return; }
  if (action==='saveEditTxn') { saveEditTxn(btn.dataset.id); return; }
  if (action==='deleteTxn') { handleDeleteTxn(btn.dataset.id); return; }
  if (action==='sortTxn') { handleSortTxn(btn.dataset.col); return; }
  if (action==='txnPagePrev') { state.txnPage = Math.max(1, state.txnPage-1); render(); return; }
  if (action==='txnPageNext') { state.txnPage = state.txnPage+1; render(); return; }
  if (action==='confirmDeleteAction') { executeConfirmedDelete(); return; }
  if (action==='saveRecurring') { saveRecurring(); return; }
  if (action==='saveTermDeposit') { saveTermDeposit(); return; }
  if (action==='saveTransferTxn') { saveTransferTxn(); return; }
  if (action==='doResetPass') { doResetPass(); return; }

  // PREFERENCES / STORAGE
  if (action==='savePrefName') { savePrefName(); return; }
  if (action==='savePrefDisplay') { savePrefDisplay(); return; }
  if (action==='chooseDBLocation') { chooseNewDBLocation(); return; }
  if (action==='openDBLocation') { openExistingDBLocation(); return; }
  if (action==='useBrowserOnly') { useBrowserStorageOnly(); return; }
  if (action==='toggleLogView') { toggleLogView(); return; }
  if (action==='downloadLogs') { downloadLogs(); return; }
  if (action==='clearLogsAction') { clearLogsAction(); return; }

  // CSV / XLSX
  if (action==='exportAccountCSV') { exportAccountCSV(btn.dataset.id); return; }
  if (action==='confirmCSVImport') { confirmCSVImport(btn.dataset.id); return; }
  if (action==='exportAllXLS') { exportAllXLS(); return; }
}

function doLogin() {
  const email = val('auth-email');
  const pass  = val('auth-pass');
  if (!email||!pass) { state.authError='Enter email and password.'; render(); return; }
  const user = db.users.find(u=>u.email===email.toLowerCase());
  if (!user || !checkPass(pass, user.passwordHash)) { logEvent('warn', 'Login failed', { email }); state.authError='Invalid email or password.'; render(); return; }
  logEvent('info', 'Login succeeded', { email });
  state.currentUser = user;
  state.screen = 'dashboard';
  state.authError = '';
  render();
}

function doRegister() {
  const name  = val('auth-name');
  const email = val('auth-email');
  const pass  = val('auth-pass');
  if (!email||!pass) { state.authError='Email and password required.'; render(); return; }
  if (db.users.find(u=>u.email===email.toLowerCase())) { state.authError='Email already registered.'; render(); return; }
  const user = { id:uid(), name, email:email.toLowerCase(), passwordHash:hashPass(pass), createdAt:today(), defaultCurrency:'USD', dateFormat:'YYYY-MM-DD' };
  db.users.push(user);
  commit();
  state.currentUser = user;
  state.screen = 'dashboard';
  state.authError = '';
  render();
}

function doResetRequest() {
  const email = val('auth-email');
  const user = db.users.find(u=>u.email===email.toLowerCase());
  const out = document.getElementById('reset-link-out');
  if (!user) {
    if (out) out.innerHTML = `<div class="msg msg-info">If that email exists, a link will be sent.</div>`;
    return;
  }
  const token = uid() + uid();
  user.resetToken = token;
  saveDB(db);
  if (out) out.innerHTML = `<div class="msg msg-success">Reset link (demo — would be emailed):<br>
    <a href="#" onclick="window._resetToken='${token}';window._resetUser='${user.id}';
    document.getElementById('root').dispatchEvent(new CustomEvent('resetClick'));return false;" 
    style="color:var(--accent2)">Click here to reset password</a></div>`;
  document.getElementById('root').addEventListener('resetClick', ()=>{
    state.modal='resetConfirm'; state.modalData={userId:window._resetUser, token:window._resetToken}; renderModal();
  }, {once:true});
}

function doResetPass() {
  const newPass = val('m-new-pass');
  const { userId, token } = state.modalData;
  const user = db.users.find(u=>u.id===userId&&u.resetToken===token);
  if (!user) { alert('Invalid reset token.'); return; }
  user.passwordHash = hashPass(newPass);
  delete user.resetToken;
  saveDB(db);
  closeModal();
  state.authSuccess = 'Password updated. Please sign in.';
  state.authTab = 'login';
  render();
}

function doLogout() {
  state.currentUser = null;
  state.screen = 'auth';
  state.authError = '';
  state.authSuccess = '';
  state.selectedBank = null;
  state.selectedAccount = null;
  render();
}

function addTransaction() {
  const date = val('new-txn-date') || today();
  const type = val('new-txn-type');
  const desc = val('new-txn-desc');
  const amt  = numVal('new-txn-amt');
  const accId = state.selectedAccount;
  if (!accId) return;

  if (type==='recurring' || type==='term_deposit') return; // handled by modal

  if (!type) { alert('Please select a transaction type.'); return; }
  if (!amt) { alert('Enter an amount.'); return; }

  const signedAmt = (type==='outgoing'||type==='transfer') ? -Math.abs(amt) : Math.abs(amt);

  if (type==='transfer') {
    const destBankId = val('transfer-dest-bank') || state.transferDestBankId;
    const destId = val('transfer-dest-account') || state.transferDestAccountId;
    if (!destBankId) { alert('Select a destination bank.'); return; }
    if (!destId) { alert('Select a destination account.'); return; }
    const destAcc = db.accounts.find(a => a.id === destId);
    if (!destAcc || destAcc.bankId !== destBankId) { alert('Select a destination account within the chosen bank.'); return; }
    createTransferTransaction({ date, amt, accId, destId });
    if (state.modal === 'transferTxn') closeModal();
  } else {
    db.transactions.push({ id:uid(), accountId:accId, date, type, description:desc, signedAmount:signedAmt });
  }
  commit();
}

function createTransferTransaction({ date, amt, accId, destId }) {
  const transferRef = uid();
  db.transactions.push({ id:uid(), accountId:accId, date, type:'transfer', description:`Transfer to ${getAccountLabel(destId)}`, signedAmount:-Math.abs(amt), transferRef });
  db.transactions.push({ id:uid(), accountId:destId, date, type:'transfer', description:`Transfer from ${getAccountLabel(accId)}`, signedAmount:Math.abs(amt), transferRef });
}

function getAccName(accId) {
  return getAccountLabel(accId);
}

function saveEditTxn(id) {
  const t = db.transactions.find(x=>x.id===id);
  if (!t) return;
  t.date = val('m-et-date') || t.date;
  t.type = val('m-et-type') || t.type;

  const newAmt = parseFloat(document.getElementById('m-et-amt')?.value);
  if (!isNaN(newAmt)) t.signedAmount = newAmt;

function handleDeleteTxn(id) {
  const t = db.transactions.find(x=>x.id===id);
  if (!t) return;
  if (t.signedAmount !== 0 && t.signedAmount != null) {
    state.modal = 'confirmDelete';
    state.modalData = { type:'txn', id, message:'Delete this transaction? This will affect balances.' };
    renderModal();
  } else {
    db.transactions = db.transactions.filter(x=>x.id!==id);
    commit();
  }
}

function handlePointerDown(e) {
  const windowEl = e.target.closest('[data-range-window]');
  const handleEl = e.target.closest('[data-range-handle]');
  if (!windowEl && !handleEl) return;
  const slider = e.target.closest('[data-txn-range-slider]');
  const acc = db.accounts.find(a=>a.id===state.selectedAccount);
  if (!slider || !acc) return;
  const bounds = getTxnRangeBounds(acc.id);
  const minNum = toDayNumber(bounds.min);
  const maxNum = toDayNumber(bounds.max);
  const startNum = toDayNumber(state.txnRangeStart);
  const endNum = toDayNumber(state.txnRangeEnd);
  state.txnRangeDrag = {
    mode: handleEl ? 'handle' : 'window',
    handle: handleEl ? handleEl.dataset.rangeHandle : null,
    startX: e.clientX,
    trackWidth: slider.getBoundingClientRect().width || 1,
    minNum,
    maxNum,
    startNum,
    endNum,
  };
  e.preventDefault();
}

function handlePointerMove(e) {
  const drag = state.txnRangeDrag;
  if (!drag) return;
  const span = Math.max(1, drag.maxNum - drag.minNum);
  const deltaDays = Math.round(((e.clientX - drag.startX) / drag.trackWidth) * span);
  let startNum = drag.startNum;
  let endNum = drag.endNum;
  if (drag.mode === 'window') {
    const windowSize = endNum - startNum;
    startNum = drag.startNum + deltaDays;
    endNum = drag.endNum + deltaDays;
    if (startNum < drag.minNum) {
      startNum = drag.minNum;
      endNum = startNum + windowSize;
    }
    if (endNum > drag.maxNum) {
      endNum = drag.maxNum;
      startNum = endNum - windowSize;
    }
  } else if (drag.handle === 'start') {
    startNum = clampNumber(drag.startNum + deltaDays, drag.minNum, drag.endNum);
  } else if (drag.handle === 'end') {
    endNum = clampNumber(drag.endNum + deltaDays, drag.startNum, drag.maxNum);
  }
  if (startNum > endNum) [startNum, endNum] = [endNum, startNum];
  setTxnRange(fromDayNumber(startNum), fromDayNumber(endNum), { renderNow: true });
}

function handlePointerUp() {
  if (!state.txnRangeDrag) return;
  state.txnRangeDrag = null;
}

function setTxnRange(start, end, opts = {}) {
  state.txnRangeStart = start;
  state.txnRangeEnd = end;
  state.txnPage = 1;
  if (opts.renderNow) render();
}

function handleSortTxn(col) {
  if (state.txnSortCol === col) {
    state.txnSortDir = state.txnSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.txnSortCol = col;
    state.txnSortDir = 'asc';
  }
  state.txnPage = 1;
  render();
}

function saveRecurring() {
  const period = val('m-rec-period');
  const count  = parseInt(val('m-rec-count'))||1;
  const date   = val('new-txn-date') || today();
  const type   = 'outgoing'; // placeholder; user set via main field or defaults
  const desc   = val('new-txn-desc');
  const amt    = numVal('new-txn-amt');
  const accId  = state.selectedAccount;

  if (!accId || !amt) { alert('Enter an amount on the transaction row first.'); closeModal(); return; }

  const base = {
    accountId: accId,
    date,
    type: 'outgoing',
    description: desc || 'Recurring',
    signedAmount: -Math.abs(amt),
    recurring: true,
    recurringGroup: uid(),
  };

  createRecurringTransactions(base, period, count);
  closeModal();
  commit();
}

function saveTermDeposit() {
  const name    = val('m-td-name');
  const desc    = val('m-td-desc');
  const parentId= val('m-td-parent');
  const amt     = numVal('m-td-amt');
  const rate    = numVal('m-td-rate');
  const term    = parseInt(val('m-td-term'))||12;
  const endDate = val('m-td-end');
  const startDate = state.modalData.date || today();

  if (!name||!amt||!parentId) { alert('Fill in all required fields.'); return; }

  const parentAcc = db.accounts.find(a=>a.id===parentId);
  if (!parentAcc) return;

  // Create term deposit account under same bank
  const tdAccId = uid();
  db.accounts.push({ id:tdAccId, bankId:parentAcc.bankId, name, type:'term', reference:name, createdAt:today(), termEnd:endDate, termRate:rate });

  // Transfer from parent to TD
  const tRef = uid();
  db.transactions.push({ id:uid(), accountId:parentId, date:startDate, type:'transfer', description:`Term Deposit — ${name}`, signedAmount:-Math.abs(amt), transferRef:tRef });
  db.transactions.push({ id:uid(), accountId:tdAccId,  date:startDate, type:'transfer', description:`Opening — ${desc||name}`, signedAmount:Math.abs(amt), transferRef:tRef });

  // Maturity: transfer back + interest
  const interest = amt * (rate/100) * (term/12);
  const mRef = uid();
  db.transactions.push({ id:uid(), accountId:tdAccId,  date:endDate, type:'transfer', description:`Maturity transfer to ${parentAcc.name}`, signedAmount:-Math.abs(amt), transferRef:mRef });
  db.transactions.push({ id:uid(), accountId:parentId, date:endDate, type:'transfer', description:`Maturity from ${name}`, signedAmount:Math.abs(amt), transferRef:mRef });
  db.transactions.push({ id:uid(), accountId:parentId, date:endDate, type:'interest', description:`Interest from ${name}`, signedAmount:Math.abs(interest) });

  closeModal();
  // Clear the term_deposit type selector
  commit();
}

function saveTransferTxn() {
  const accId = state.selectedAccount;
  const acc = db.accounts.find(a => a.id === accId);
  if (!acc) return;
  const date = val('new-txn-date') || today();
  const amt = parseFloat(document.getElementById('transfer-amount')?.value);
  if (!amt || amt <= 0) { alert('Enter an amount.'); return; }
  const destBankId = val('transfer-dest-bank') || state.transferDestBankId;
  const destId = val('transfer-dest-account') || state.transferDestAccountId;
  if (!destBankId) { alert('Select a destination bank.'); return; }
  if (!destId) { alert('Select a destination account.'); return; }
  const destAcc = db.accounts.find(a => a.id === destId);
  if (!destAcc || destAcc.bankId !== destBankId) {
    alert('Select a destination account within the chosen bank.');
    return;
  }
  const sourceBalance = getRunningBalance(accId, date);
  if (amt > sourceBalance) {
    alert('Transfer amount exceeds the origin account balance.');
    return;
  }
  createTransferTransaction({ date, amt, accId, destId });
  closeModal();
  state.txnPage = 1;
  saveDB(db);
  render();
}

function executeConfirmedDelete() {
  const { type, id } = state.modalData;
  if (type==='bank') {
    db.banks = db.banks.filter(b=>b.id!==id);
    if (state.selectedBank===id) { state.selectedBank=null; state.screen='dashboard'; }
  } else if (type==='account') {
    db.accounts = db.accounts.filter(a=>a.id!==id);
    if (state.selectedAccount===id) { state.selectedAccount=null; state.screen='bank'; }
  } else if (type==='txn') {
    db.transactions = db.transactions.filter(t=>t.id!==id);
  }
  closeModal();
  commit();
}

// ─────────────────────────────────────────────────────────────
//  CSV IMPORT / EXPORT (per account)
// ─────────────────────────────────────────────────────────────
let _csvParsedRows = null; // staged rows awaiting confirm

function setupCSVDropZone(accountId) {
  logEvent('info', 'CSV import modal opened', { accountId });
  const zone = document.getElementById('csv-drop-zone');
  const input = document.getElementById('csv-file-input');
  if (!zone || !input) {
    logEvent('error', 'CSV drop zone or file input not found in DOM');
    return;
  }
  if (!accountId) {
    logEvent('error', 'CSV import setup called without an accountId — import will fail');
  }

  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    logEvent('info', 'CSV file selected via picker', { name: file?.name, size: file?.size, type: file?.type });
    if (file) handleCSVFile(file, accountId);
    else logEvent('warn', 'File input change fired with no file');
  });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    logEvent('info', 'CSV file dropped', { name: file?.name, size: file?.size, type: file?.type });
    if (file) handleCSVFile(file, accountId);
    else logEvent('warn', 'Drop event fired with no file');
  });
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (!lines.length) { logEvent('warn', 'CSV file appears empty'); return []; }
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/^"|"$/g,''));
  logEvent('info', 'CSV headers parsed', { headers, lineCount: lines.length - 1 });
  const requiredCols = ['date','amount'];
  const missing = requiredCols.filter(c => !headers.includes(c));
  if (missing.length) logEvent('warn', 'CSV missing expected columns', { missing, headers });
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = splitCSVLine(lines[i]);
    const row = {};
    headers.forEach((h, idx) => row[h] = (cells[idx]||'').trim());
    rows.push(row);
  }
  return rows;
}

function splitCSVLine(line) {
  const out = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { out.push(cur); cur=''; }
    else { cur += ch; }
  }
  out.push(cur);
  return out.map(c => c.replace(/^"|"$/g,''));
}

function handleCSVFile(file, accountId) {
  if (!accountId) {
    logEvent('error', 'handleCSVFile called without accountId — aborting import');
    alert('Could not determine which account to import into. Please close this dialog and try again from the account screen.');
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => {
    logEvent('error', 'FileReader failed to read the CSV file', reader.error);
    alert('Could not read that file. Please try again.');
  };
  reader.onload = e => {
    try {
      const rows = parseCSV(e.target.result);
      const validTypes = ['income','outgoing','interest','transfer'];
      const parsed = rows.map((r, idx) => {
        const date = r.date || '';
        let type = (r.type||'').toLowerCase();
        if (!validTypes.includes(type)) type = parseFloat(r.amount) < 0 ? 'outgoing' : 'income';
        let amount = parseFloat(r.amount);
        if (isNaN(amount)) amount = 0;
        if (type==='outgoing' && amount > 0) amount = -amount;
        if (type!=='outgoing' && type!=='transfer' && amount < 0) amount = Math.abs(amount);
        const valid = !!date && /^\d{4}-\d{2}-\d{2}$/.test(date) && amount !== 0;
        return { row: idx+2, date, type, description: r.description||'', amount, valid };
      });
      const validCount = parsed.filter(p=>p.valid).length;
      logEvent('info', 'CSV parsed', { totalRows: parsed.length, validRows: validCount, invalidRows: parsed.length - validCount });
      _csvParsedRows = { accountId, parsed };
      renderCSVPreview(parsed, accountId);
    } catch (err) {
      logEvent('error', 'Exception while parsing CSV', err);
      alert('Something went wrong reading that CSV. Check the log in Preferences for details.');
    }
  };
  reader.readAsText(file);
}

function renderCSVPreview(parsed, accountId) {
  const wrap = document.getElementById('csv-preview-wrap');
  const acc = db.accounts.find(a=>a.id===accountId);
  const currency = acc ? acc.currency : undefined;
  const validCount = parsed.filter(p=>p.valid).length;
  const invalidCount = parsed.length - validCount;
  const rowsHtml = parsed.slice(0,15).map(p => `
    <tr style="${p.valid?'':'opacity:.4'}">
      <td>${p.row}</td><td>${esc(p.date)||'<span class="dimmed">missing</span>'}</td>
      <td><span class="badge badge-${p.type}">${p.type}</span></td>
      <td>${esc(p.description)}</td>
      <td class="text-right">${fmt(p.amount, currency)}</td>
    </tr>`).join('');
  wrap.innerHTML = `
    <div class="info-box" style="margin-top:1rem">
      ${validCount} valid row${validCount!==1?'s':''} ready to import${invalidCount?`, ${invalidCount} skipped (missing/invalid date or zero amount)`:''}.
    </div>
    <div class="table-wrap" style="max-height:240px;overflow-y:auto">
      <table>
        <thead><tr><th>Row</th><th>Date</th><th>Type</th><th>Description</th><th class="text-right">Amount</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    ${parsed.length>15 ? `<div class="dimmed" style="margin-top:.4rem;font-size:.8rem">…and ${parsed.length-15} more rows</div>` : ''}`;
  const confirmBtn = document.getElementById('csv-confirm-btn');
  if (confirmBtn) confirmBtn.style.display = validCount ? 'inline-flex' : 'none';
}

function confirmCSVImport(accountId) {
  if (!_csvParsedRows) { logEvent('error', 'confirmCSVImport called with no staged rows'); return; }
  if (!accountId) logEvent('warn', 'confirmCSVImport accountId param missing, falling back to staged accountId', { staged: _csvParsedRows.accountId });
  const targetAccountId = accountId || _csvParsedRows.accountId;
  const valid = _csvParsedRows.parsed.filter(p=>p.valid);
  valid.forEach(p => {
    db.transactions.push({
      id: uid(), accountId: targetAccountId, date: p.date, type: p.type,
      description: p.description, signedAmount: p.amount, imported: true
    });
  });
  logEvent('info', 'CSV import committed', { accountId: targetAccountId, rowsImported: valid.length });
  _csvParsedRows = null;
  closeModal();
  commit();
}

function exportAccountCSV(accountId) {
  const acc = db.accounts.find(a=>a.id===accountId);
  if (!acc) { logEvent('error', 'exportAccountCSV: account not found', { accountId }); return; }
  const txns = getAccountTxns(accountId);
  const header = 'date,type,description,amount\n';
  const rows = txns.map(t => {
    const desc = (t.description||'').replace(/"/g,'""');
    return `${t.date},${t.type},"${desc}",${t.signedAmount||0}`;
  }).join('\n');
  downloadFile(`${acc.name.replace(/[^a-z0-9]+/gi,'_')}_transactions.csv`, header + rows, 'text/csv');
  logEvent('info', 'Account CSV exported', { accountId, rowCount: txns.length });
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ─────────────────────────────────────────────────────────────
//  GLOBAL XLSX EXPORT  (one sheet per account)
// ─────────────────────────────────────────────────────────────
function exportAllXLS() {
  if (typeof XLSX === 'undefined') { logEvent('error', 'XLSX library not loaded'); alert('Spreadsheet library failed to load.'); return; }
  const banks = getUserBanks();
  if (!banks.length) { logEvent('warn', 'exportAllXLS: no banks to export'); alert('No data to export yet.'); return; }

  const wb = XLSX.utils.book_new();
  const usedNames = new Set();

  banks.forEach(bank => {
    const accs = getBankAccounts(bank.id);
    accs.forEach(acc => {
      const txns = getAccountTxns(acc.id);
      let running = 0;
      const data = txns.map(t => {
        running += (t.signedAmount||0);
        return {
          Date: t.date,
          Type: t.type,
          Description: t.description||'',
          Amount: t.signedAmount||0,
          'Running Balance': running,
          Recurring: t.recurring ? 'Yes' : '',
        };
      });
      const ws = XLSX.utils.json_to_sheet(data.length ? data : [{Date:'',Type:'',Description:'',Amount:'','Running Balance':'',Recurring:''}]);
      ws['!cols'] = [{wch:12},{wch:10},{wch:30},{wch:12},{wch:16},{wch:10}];

      let sheetName = `${bank.name}-${acc.name}`.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31);
      let base = sheetName, n = 1;
      while (usedNames.has(sheetName)) { sheetName = `${base.slice(0,28)}~${n++}`; }
      usedNames.add(sheetName);

      XLSX.utils.book_append_sheet(wb, ws, sheetName || `Sheet${usedNames.size}`);
    });
  });

  if (!wb.SheetNames.length) { logEvent('warn', 'exportAllXLS: no accounts to export'); alert('No accounts to export yet.'); return; }
  XLSX.writeFile(wb, `vaultflow_export_${today()}.xlsx`);
  logEvent('info', 'Global XLSX export completed', { sheets: wb.SheetNames.length });
}

// ─────────────────────────────────────────────────────────────
//  PREFERENCES ACTIONS
// ─────────────────────────────────────────────────────────────
function savePrefName() {
  const name = val('m-pref-name');
  if (state.currentUser) {
    state.currentUser.name = name;
    saveDB(db);
  }
  state.prefMessage = 'Name updated.';
  renderModal();
}

function savePrefDisplay() {
  const currency = val('m-pref-currency');
  const dateFormat = val('m-pref-dateformat');
  if (state.currentUser) {
    state.currentUser.defaultCurrency = currency || state.currentUser.defaultCurrency;
    state.currentUser.dateFormat = dateFormat || state.currentUser.dateFormat;
    saveDB(db);
    logEvent('info', 'Display preferences updated', { currency: state.currentUser.defaultCurrency, dateFormat: state.currentUser.dateFormat });
  }
  state.prefMessage = 'Display settings updated.';
  render();
}

function renderLogTable() {
  if (!appLogs.length) return `<div class="dimmed" style="font-size:.85rem">No log entries yet.</div>`;
  const rows = appLogs.slice().reverse().slice(0, 200).map(l => {
    const colorVar = l.level==='error' ? 'var(--red)' : l.level==='warn' ? 'var(--yellow)' : 'var(--text2)';
    const time = new Date(l.ts).toLocaleTimeString();
    return `<tr>
      <td style="white-space:nowrap;font-size:.75rem;color:var(--text3)">${time}</td>
      <td style="white-space:nowrap"><span style="color:${colorVar};font-weight:700;font-size:.72rem;text-transform:uppercase">${l.level}</span></td>
      <td style="font-size:.8rem">${esc(l.message)}</td>
      <td style="font-size:.75rem;color:var(--text3);font-family:monospace">${esc((l.data||'').slice(0,160))}</td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap" style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm)">
    <table>
      <thead><tr><th>Time</th><th>Level</th><th>Message</th><th>Detail</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function toggleLogView() {
  state.showLogs = !state.showLogs;
  renderModal();
}

function downloadLogs() {
  const lines = appLogs.map(l => `${l.ts}\t${l.level.toUpperCase()}\t${l.message}${l.data?'\t'+l.data:''}`).join('\n');
  downloadFile(`vaultflow_log_${today()}.txt`, lines, 'text/plain');
  logEvent('info', 'Log downloaded by user');
}

function clearLogsAction() {
  clearLogs();
  state.prefMessage = 'Log cleared.';
  renderModal();
}


function checkURLReset() {
  const hash = window.location.hash;
  if (hash.startsWith('#reset=')) {
    const token = hash.slice(7);
    const user = db.users.find(u=>u.resetToken===token);
    if (user) {
      state.authTab = 'reset';
      state.modal = 'resetConfirm';
      state.modalData = { userId:user.id, token };
    }
    window.location.hash = '';
  }
}

// ─────────────────────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────────────────────
checkURLReset();
render();
</script>
